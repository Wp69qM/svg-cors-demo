<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link type="text/css" rel="stylesheet" href="css/style.css" />
    <script type="text/javascript" src="js/script.js"></script>
    <style>
      .svgCircle {
        fill: red;
        stroke: green;
        stroke-width: 4px;
      }
    </style>
  </head>
  <body>
    <!-- 位图 -->
    <div>
      <img src="./svg/right_arrow_gray.png" alt="" width="88" height="152" />
    </div>

    <!-- 矢量图 -->
    <div>
      <img src="./svg/right_arrow_gray.svg" alt="" width="88" height="152" />
    </div>

    <!-- 样式和脚本 -->

    <!-- 外部样式 -->
    <svg width="100" height="100">
      <circle class="svgCircle" cx="50" cy="50" r="40" />
    </svg>

    <!-- // 属性 -->
    <svg width="100" height="100">
      <rect x="30" y="30" width="30" height="50" fill="hotpink" />
    </svg>

    <!-- // 内联样式 -->
    <svg width="100" height="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        style="fill: #aeaeae; stroke: black; stroke-width: 2"
      />
    </svg>

    <!-- svg内style标签 -->
    <svg width="200" height="200">
      <style>
        #blue_svg {
          fill: blue;
          stroke: black;
          stroke-width: 2;
        }
        <!-- @import url('./css/style.css') -->
      </style>
      <circle id="blue_svg" cx="100" cy="100" r="40" />
      <script type="text/javascript">
        var svgElement= document.getElementById('blue_svg');
        svgElement.addEventListener('mouseover', function() {
        svgElement.style.transform = 'scale(1.2)'; svgElement.style.transition =
        'transform 0.5s ease'; }); svgElement.addEventListener('mouseout',
        function() { svgElement.style.transform = 'scale(1)'; });
      </script>
    </svg>

    <!-- link标签 -->
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
      <link href="./css/style.css" rel="stylesheet" type="text/css" />
      <circle cx="50" cy="50" r="40" class="red-circle" />
    </svg>
  </body>
</html>
